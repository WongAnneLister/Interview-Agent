# VPS 上的开发依赖：Postgres、Redis、S3 兼容对象存储（SeaweedFS）、Prometheus、Grafana。
# Prometheus、Grafana 放在 observability profile 里，用 make obs-up / make obs-down 单独启停；
# make vps-deploy 只管核心服务。Langfuse 运行在本机（deploy/local/docker-compose.yml），
# 这台 VPS 内存不够跑 ClickHouse。
# 安全约定：所有端口只绑定 127.0.0.1，本机通过 scripts/tunnel.sh 的 SSH 隧道访问，不对公网开放。
# 资源约定：这台 VPS 上还有其它项目，每个服务都设置内存上限，避免挤占它们。
# 密码等变量来自同目录的 .env（由 init-env.sh 在服务器上随机生成，不进仓库）。

name: interview-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interview-agent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3 兼容对象存储（MinIO 已不再提供公开镜像，开发环境改用 SeaweedFS）。
  # 业务代码只通过标准 S3 API 访问，生产环境可换成阿里云 OSS 等。
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: interview-agent-seaweedfs
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -volume.max=20
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT}:8333"
      - "127.0.0.1:${S3_BROWSER_PORT}:8888"
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 384m
    healthcheck:
      # 单节点首次启动要先完成 raft 选主（约 30–60 秒），选主成功才算健康
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status | grep -q '\"IsLeader\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  # 创建私有桶 recordings 和 resumes（已存在时忽略报错，可重复执行）
  s3-init:
    image: chrislusf/seaweedfs:latest
    container_name: interview-agent-s3-init
    depends_on:
      - seaweedfs
    # 不用 service_healthy：compose 在启动宽限期内也可能判定为 unhealthy。这里自己轮询选主完成（最多 3 分钟）。
    entrypoint: >
      /bin/sh -c "
      i=0; until wget -q -O - http://seaweedfs:9333/cluster/status | grep -q '\"IsLeader\":true'; do
        i=$$((i+1)); [ $$i -gt 60 ] && echo 'seaweedfs 未就绪' && exit 1; sleep 3; done;
      echo 's3.bucket.create -name recordings' | weed shell -master=seaweedfs:9333 || true;
      echo 's3.bucket.create -name resumes' | weed shell -master=seaweedfs:9333 || true;
      echo 's3.bucket.list' | weed shell -master=seaweedfs:9333
      "
    restart: "no"

  # Prometheus 和 Grafana 使用 host 网络并只监听 127.0.0.1：
  # 这样 Prometheus 能抓到 SSH 反向隧道转发过来的本机指标端口（同样在 127.0.0.1 上）。
  prometheus:
    image: prom/prometheus:latest
    container_name: interview-agent-prometheus
    profiles: [observability]
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT}
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:latest
    container_name: interview-agent-grafana
    profiles: [observability]
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PROMETHEUS_URL: http://127.0.0.1:${PROMETHEUS_PORT}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  prometheus-data:
  grafana-data:
