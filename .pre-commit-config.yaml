# Keep this file ASCII-only: pre-commit reads it with the system locale on Windows (GBK).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env (commit .env.example only)
        entry: ".env files contain secrets and must not be committed; commit .env.example instead"
        language: fail
        files: '(^|/)\.env(\.[^/]+)?$'
        exclude: '(^|/)\.env\.example$'

      # Use the ruff version locked in the backend venv so hooks match `make lint`.
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
