type: technical
style: gentle
language: zh
jd: |
  职位：语音交互 agent 工程师
  职责：
  1. 负责实时语音对话 agent 的端到端链路：语音识别、大模型、语音合成的流式集成；
  2. 优化端到端延迟、打断处理和轮次检测，提升对话自然度；
  3. 建设语音链路的指标监控和自动化评测。
  要求：
  1. 3 年以上 Python 或 Go 开发经验，熟悉 asyncio 等异步编程；
  2. 熟悉 WebRTC 或 WebSocket 实时音频传输；
  3. 了解 VAD、流式识别、流式合成的工作原理和常见问题；
  4. 有 LiveKit、Pipecat 等语音 agent 框架经验者优先；
  5. 有延迟优化和线上稳定性保障经验。
