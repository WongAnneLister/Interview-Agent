id: data
name: 数据开发
type: technical
style: gentle
language: zh
jd: |
  职位：数据开发工程师（实时数仓）
  职责：
  1. 负责公司实时与离线数仓的建设，支撑运营、风控和推荐业务；
  2. 负责数据模型设计、数据质量治理和任务调度优化；
  3. 与算法、分析团队协作，提供稳定、准确的数据服务。
  要求：
  1. 3 年以上数据开发经验，熟悉 Hive、Spark SQL；
  2. 熟悉 Flink 实时计算，理解窗口、水位线、状态与检查点；
  3. 熟悉维度建模，有数仓分层设计经验；
  4. 有数据质量监控与治理经验；
  5. 熟悉 Kafka，了解 ClickHouse 或 Doris 等 OLAP 引擎。
resume: |
  许明川 | 数据开发工程师 | 4 年经验
  工作经历
  2022.04–至今 行舟出行 数据开发工程师
  - 负责实时数仓建设：Kafka + Flink + Doris，订单实时看板延迟从 5 分钟降到 8 秒。
  - 设计 ODS/DWD/DWS/ADS 四层模型，沉淀 30 多张公共明细宽表，重复开发减少约 40%。
  - 处理乱序订单事件：事件时间 + 30 秒水位线 + 迟到数据侧输出补偿，日指标误差从 1.2% 降到 0.05%。
  - 建立数据质量规则 300 多条（空值、唯一性、波动），核心报表事故从每月 4 次降到 0–1 次。
  2020.07–2022.03 恒信科技 大数据开发工程师
