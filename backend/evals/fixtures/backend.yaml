id: backend
name: 后端开发
type: technical
style: gentle
language: zh
jd: |
  职位：高级后端开发工程师（交易平台）
  职责：
  1. 负责订单、支付、库存等核心交易链路的设计与开发，保障高并发下的一致性与可用性；
  2. 负责服务拆分与治理，推动缓存、消息队列、限流熔断等基础设施落地；
  3. 定位和解决线上性能与稳定性问题，参与容量规划和故障复盘。
  要求：
  1. 本科及以上，4 年以上 Java 或 Go 后端开发经验；
  2. 熟悉 MySQL 索引与事务、Redis 常用数据结构与缓存一致性方案；
  3. 熟悉 Kafka 或 RocketMQ，理解消息可靠投递与幂等；
  4. 有分布式系统设计经验，理解分布式事务、服务降级与限流；
  5. 有线上问题排查经验，熟悉常见性能分析工具。
resume: |
  林嘉树 | 高级后端工程师 | 6 年经验
