jd: |
  职位：资深前端开发工程师（数据可视化平台）
  职责：
  1. 负责数据分析平台前端架构设计和核心模块开发；
  2. 负责大数据量表格、图表的渲染性能优化；
  3. 建设组件库与前端工程化体系，提升团队研发效率。
  要求：
  1. 4 年以上前端开发经验，精通 TypeScript 和 React；
  2. 熟悉浏览器渲染原理，有首屏和运行时性能优化经验；
  3. 熟悉 Webpack 或 Vite 等构建工具，有工程化建设经验；
  4. 有 ECharts、D3 或 Canvas 可视化开发经验；
  5. 了解前端监控与错误追踪。
