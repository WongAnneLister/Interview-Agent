jd: |
  职位：大模型应用开发工程师
  职责：
  1. 基于大模型构建企业知识库问答、智能客服等应用，负责检索增强生成（RAG）链路的设计与优化；
  2. 设计提示词与工具调用流程，搭建 agent 工作流；
  3. 建立离线评测与线上监控体系，持续提升回答准确率并控制成本。
  要求：
  1. 3 年以上 Python 开发经验，熟悉 FastAPI 或同类框架；
  2. 熟悉向量检索、文档切分、重排序等 RAG 关键环节；
  3. 有提示词工程和结构化输出经验，了解函数调用与 agent 框架；
  4. 有大模型应用评测经验，能设计评测集和指标；
  5. 了解大模型推理成本与延迟优化方法。
