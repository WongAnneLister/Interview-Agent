# 厂商单价表（observability/pricing.py 加载并校验，格式错误时启动即失败）。
#
# 单价以厂商官方价格页为准；填写时在 source 写上价格页链接，并在注释里写查询日期。
# - price_cny：每 per 个计量单位的人民币价格；留空（null）表示未知，该项成本记为空并告警，不中断业务。
# - per：计价基数，默认 1（例如按百万 token 计价写 1000000）。
# - 计量单位（彼此不重叠，各按自己的单价计费）：
#     input_tokens 未命中缓存的输入 / cached_tokens 命中缓存的输入 /
#     output_tokens 不含推理的输出 / reasoning_tokens 推理 token /
#     audio_seconds 音频秒数 / characters 字符数
# - 同一 provider + model 可以有多条：按 effective_from（北京时间日期）取调用时已生效的最新一条，
#   这一条整体替代更早的价格（未列出的单位视为缺价格）。
prices:
  # 百炼：查询于 2026-10-16，华北2（北京）部署范围。
  # - qwen3.8 的输入单价不分阶梯（单次输入 ≤1M token），思考与非思考模式单价相同，思考 token 按输出计价。
  # - qwen3.8-flash / qwen3.8-max 的隐式缓存命中单价官方页未公开（上下文缓存文档写明“请参见百炼控制台”），
  #   这里暂按输入单价保守估计（成本偏高，不会让预算保护漏报）；在控制台确认后新增一条更正。
  - provider: bailian
    model: qwen3.8-flash
    effective_from: 2026-10-16
    source: https://help.aliyun.com/zh/model-studio/model-pricing
    units:
      input_tokens: {price_cny: 0.8, per: 1000000}
      cached_tokens: {price_cny: 0.8, per: 1000000}
      output_tokens: {price_cny: 2.7, per: 1000000}
      reasoning_tokens: {price_cny: 2.7, per: 1000000}
  - provider: bailian
    model: qwen3.8-max
    effective_from: 2026-10-16
    source: https://help.aliyun.com/zh/model-studio/model-pricing
    units:
      input_tokens: {price_cny: 12, per: 1000000}
      cached_tokens: {price_cny: 12, per: 1000000}
      output_tokens: {price_cny: 36, per: 1000000}
      reasoning_tokens: {price_cny: 36, per: 1000000}
  # DeepSeek：查询于 2026-10-16（中文价格页，人民币）。
  # - 分高峰（北京时间工作日 9:00–12:00、14:00–18:00）和空闲时段，空闲为半价；
  #   单价表不支持按时段计价，一律按高峰价估计（成本偏高）。
  # - deepseek-flash 对应 DeepSeek-V4.1-Flash；思考 token 按输出计价。
  - provider: deepseek
    model: deepseek-flash
    effective_from: 2026-10-16
    source: https://api-docs.deepseek.com/zh-cn/quick_start/pricing
    units:
      input_tokens: {price_cny: 2, per: 1000000}
      cached_tokens: {price_cny: 0.04, per: 1000000}
      output_tokens: {price_cny: 8, per: 1000000}
      reasoning_tokens: {price_cny: 8, per: 1000000}
# 示例：
#  - provider: bailian
#    model: <型号>
#    effective_from: 2026-10-01
#    source: <官方价格页链接>
#    units:
#      input_tokens: {price_cny: null, per: 1000000}
#      cached_tokens: {price_cny: null, per: 1000000}
#      output_tokens: {price_cny: null, per: 1000000}
  # 百炼实时语音识别：查询于 2026-10-16，华北2（北京），音频时长 0.00033 元/秒（不含新用户免费额度）。
  # 按任务内发送的音频时长计费（含静音），2026-10-17 实测确认，取值方式见 providers/bailian_asr.py。
  - provider: bailian
    model: fun-asr-realtime
    effective_from: 2026-10-16
    source: https://help.aliyun.com/zh/model-studio/fun-asr-realtime
    units:
      audio_seconds: {price_cny: 0.00033, per: 1}
  - provider: bailian
    model: fun-asr-realtime-2026-02-28
    effective_from: 2026-10-16
    source: https://help.aliyun.com/zh/model-studio/fun-asr-realtime
    units:
      audio_seconds: {price_cny: 0.00033, per: 1}
  # 百炼语音合成：查询于 2026-10-17，华北2（北京），1 元/万字符（不含免费额度）。
  # 计费字符取服务端 usage.characters，汉字计几个字符待 live 测试确认，见 providers/bailian_tts.py。
  - provider: bailian
    model: cosyvoice-v3-flash
    effective_from: 2026-10-17
    source: https://help.aliyun.com/zh/model-studio/cosyvoice-v3-flash
    units:
      characters: {price_cny: 1, per: 10000}
  # Qwen-TTS Realtime：查询于 2026-10-17，华北2（北京），1 元/万字符（不含免费额度）。
  # 计费字符取各 response.done 的 usage.characters 之和，计数规则待 live 测试确认。
  - provider: bailian
    model: qwen3-tts-flash-realtime
    effective_from: 2026-10-17
    source: https://help.aliyun.com/zh/model-studio/qwen3-tts-flash-realtime
    units:
      characters: {price_cny: 1, per: 10000}
